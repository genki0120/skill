name: Mirror upstream snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror upstream
        run: |
          git clone --depth 1 https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git /tmp/upstream
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/upstream/. .
          rm -rf .git
        working-directory: /tmp/placeholder
