name: Mirror upstream snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git /tmp/upstream
          rsync -a --delete --exclude='.git/' /tmp/upstream/ ./
      - name: Create mirror pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: mirror nextlevelbuilder/ui-ux-pro-max-skill
          title: Mirror UI UX Pro Max upstream snapshot
          body: Mirror the current upstream main snapshot into this repository.
          branch: mirror/upstream
          delete-branch: true
